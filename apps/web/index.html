<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Flux</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="app.css" />
    <script>
      try {
        var t = localStorage.getItem("flux-theme"),
          f = localStorage.getItem("flux-font");
        if (t) document.documentElement.dataset.flux = t;
        if (f) document.documentElement.dataset.font = f;
      } catch (e) {}
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="crush">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="dist/bundle.js"></script>
  </body>
</html>
