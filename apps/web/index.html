<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#181513" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self';"
    />
    <title>Flux</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="app.css" />
    <script>
      try {
        var t = localStorage.getItem("flux-theme"),
          f = localStorage.getItem("flux-font");
        if (t) document.documentElement.dataset.flux = t;
        if (f) document.documentElement.dataset.font = f;
      } catch (e) {}

      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
          });
        });
      }
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="crush">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="dist/bundle.js"></script>
  </body>
</html>
