name: Release

# Every push to main that changes the app builds Flux for Windows, macOS (Apple silicon and Intel) and Linux and
# publishes a GitHub release, v2.0.<run number>. The download page and the in-app updater read the latest release.
# Pushes that only touch docs, the website or tests don't make a release.
#
# Caches: rust-cache keeps dependencies per target, sccache keeps every compiled crate, npm is cached, so a push
# rebuilds only the crates that changed.
#
# Signing the updater: add the repository secret TAURI_SIGNING_PRIVATE_KEY (the key made with `tauri signer
# generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the key has none). Without the key the installers are
# still built and published, but no updater files are made, so installed copies won't update themselves.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "tests/**"
      - "design/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.make.outputs.id }}
      version: ${{ steps.make.outputs.version }}
    steps:
      - id: make
        uses: actions/github-script@v7
        with:
          script: |
            const version = `2.0.${context.runNumber}`;
            const tag = `v${version}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.sha, name: `Flux ${version}`, draft: true,
              body: [
                `Flux ${version}, built from ${context.sha.slice(0, 7)}.`,
                '',
                '**Windows:** `*_x64-setup.exe` (or the `.msi`). **macOS:** `*_aarch64.dmg` for Apple silicon, `*_x64.dmg` for Intel. **Linux:** `.AppImage`, `.deb` or `.rpm`.',
                '',
                'Installed copies update themselves. `flux-mcp-*` files are the MCP server on its own, for agents on computers without the app.',
              ].join('\n'),
            });
            core.setOutput('id', String(data.id));
            core.setOutput('version', version);

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # sccache only saves time, so a failed download (GitHub answers 504 at times) must not fail the build.
      # Without annotations the action's post step has nothing to do, so it can't fail either.
      - id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        with:
          disable_annotations: "true"
      - name: Use sccache if it installed
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Stamp the version
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), v = process.env.VERSION;
            const conf = "apps/desktop/src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(conf, "utf8"));
            c.version = v;
            // Updater files need the signing key; without it, build the installers alone.
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY) c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(conf, JSON.stringify(c, null, 2));
            const cargo = fs.readFileSync("Cargo.toml", "utf8").replace(/(\[workspace\.package\][^\[]*?version = ")[^"]+"/, `$1${v}"`);
            fs.writeFileSync("Cargo.toml", cargo);
          '
          grep -n '^version' Cargo.toml
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no updater files, installed copies won't update themselves."; fi

      - name: Build the MCP server (bundled with the app)
        run: node scripts/sidecar.mjs --target ${{ matrix.target }}

      # The bundler downloads its tools (NSIS, WiX, AppImage) from GitHub on every run, and GitHub answers 504 at
      # times. Kept between runs, they are only downloaded once.
      - name: Keep the bundler's tools
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
            ~/Library/Caches/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Build and upload the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tauriScript: npx tauri
          args: --config apps/desktop/src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          updaterJsonPreferNsis: true
          # A download that fails the first time usually works a moment later; compiled code is reused.
          retryAttempts: 3

      # macOS says an app is "damaged" when its bundle isn't signed as a whole. The config signs it ad hoc ("-");
      # this fails the build, and so removes the draft, if the seal is missing or broken.
      - name: Check the Mac app is signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Flux.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Authority='
          codesign -d --entitlements - "$app" 2>&1 | grep -q 'com.apple.security.device.audio-input'
          for bin in "$app"/Contents/MacOS/*; do codesign --verify --strict "$bin"; done
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          hdiutil verify "$dmg"

      - name: Check the Linux packages open
        if: runner.os == 'Linux'
        shell: bash
        run: |
          b="target/${{ matrix.target }}/release/bundle"
          img=$(ls "$b"/appimage/*.AppImage)
          test -x "$img"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$img" --appimage-extract > /dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/AppRun"
          dpkg-deb --info "$b"/deb/*.deb | grep -E 'Package|Depends'
          if command -v rpm > /dev/null; then rpm -qip "$b"/rpm/*.rpm | grep -E '^Name'; else test -s "$(ls "$b"/rpm/*.rpm)"; fi

      - name: Upload the MCP server on its own
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          name="flux-mcp-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/flux-mcp$ext" "$name"
          # By release id: the draft has no tag until it's published.
          gh api --method POST -H "Content-Type: application/octet-stream"             "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}/assets?name=$name"             --input "$name" > /dev/null

  publish:
    name: Publish
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number('${{ needs.draft.outputs.id }}'), draft: false, make_latest: 'true',
            });

  clean-up:
    name: Remove the draft if a build failed
    needs: [draft, build]
    if: failure() && needs.draft.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner, repo: context.repo.repo, release_id: Number('${{ needs.draft.outputs.id }}'),
            });
