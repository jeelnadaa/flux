name: Release Native Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable Package
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native release binaries
        run: cargo build --release --workspace --bins

      - name: Prepare Windows standalone package
        shell: powershell
        run: |
          $Version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v', '' } else { '1.0.0' }
          $PkgDir = "Flux-$Version-win-x64"
          New-Item -ItemType Directory -Force -Path $PkgDir
          New-Item -ItemType Directory -Force -Path "$PkgDir/licenses"
          New-Item -ItemType Directory -Force -Path "$PkgDir/tools"

          # Copy binary
          if (Test-Path "target/release/flux.exe") {
            Copy-Item "target/release/flux.exe" -Destination "$PkgDir/Flux.exe"
          } else {
            $Found = Get-ChildItem -Recurse -Filter "flux.exe" target | Select-Object -First 1
            if ($Found) {
              Copy-Item $Found.FullName -Destination "$PkgDir/Flux.exe"
            } else {
              Write-Error "Native flux.exe binary not found!"
              exit 1
            }
          }

          # Copy documents and notices
          Copy-Item "LICENSES.md" -Destination "$PkgDir/licenses/NOTICES.txt"
          Copy-Item "README.md" -Destination "$PkgDir/README.txt"

          # Create portable flag file
          New-Item -ItemType File -Force -Path "$PkgDir/portable.flag"

          # Create zip package
          Compress-Archive -Path "$PkgDir/*" -DestinationPath "$PkgDir.zip" -Force
          Write-Output "PACKAGE_ZIP=$PkgDir.zip" >> $env:GITHUB_ENV
          Get-FileHash "$PkgDir.zip" -Algorithm SHA256 | Out-File "$PkgDir.zip.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: Flux-*-win-x64.zip*

  build-macos:
    name: Build macOS Universal Package
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build native release binaries
        run: |
          cargo build --release --workspace --bins
          cargo build --release --target aarch64-apple-darwin --bin flux || true
          cargo build --release --target x86_64-apple-darwin --bin flux || true

      - name: Prepare macOS standalone package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION" = "$GITHUB_REF" ] && VERSION="1.0.0"
          PKG_NAME="Flux-v${VERSION}-macos-universal"
          mkdir -p "$PKG_NAME/Flux.app/Contents/MacOS"
          mkdir -p "$PKG_NAME/Flux.app/Contents/Resources"

          # Choose Universal or host binary
          if [ -f target/aarch64-apple-darwin/release/flux ] && [ -f target/x86_64-apple-darwin/release/flux ]; then
            echo "[*] Creating Universal 2 binary with lipo..."
            lipo -create -output "$PKG_NAME/Flux.app/Contents/MacOS/Flux" \
              target/aarch64-apple-darwin/release/flux \
              target/x86_64-apple-darwin/release/flux
          elif [ -f target/release/flux ]; then
            cp target/release/flux "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
          elif [ -f target/aarch64-apple-darwin/release/flux ]; then
            cp target/aarch64-apple-darwin/release/flux "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
          else
            FOUND_BIN=$(find target -name "flux" -type f | head -n 1)
            if [ -n "$FOUND_BIN" ] && [ -f "$FOUND_BIN" ]; then
              cp "$FOUND_BIN" "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
            else
              echo "Error: Native flux binary not found in target directories."
              exit 1
            fi
          fi
          chmod +x "$PKG_NAME/Flux.app/Contents/MacOS/Flux"

          # Create macOS Info.plist bundle descriptor
          cat << 'EOF' > "$PKG_NAME/Flux.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Flux</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>in.solarquack.flux</string>
              <key>CFBundleName</key>
              <string>Flux</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          cp README.md "$PKG_NAME/README.txt"
          cp LICENSES.md "$PKG_NAME/LICENSES.txt"

          zip -r "${PKG_NAME}.zip" "$PKG_NAME"
          shasum -a 256 "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable-zip
          path: Flux-*-macos-universal.zip*

  release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.zip*
          name: Flux ${{ github.ref_name }} — Native Standalone
          body: |
            ## Flux Native Audio Editor ${{ github.ref_name }}

            Standalone, self-contained native builds for Windows and macOS with all audio codecs and DSP primitives bundled.

            ### Downloads
            - **Windows (x64 Portable):** `Flux-${{ github.ref_name }}-win-x64.zip` — unpack anywhere and run `Flux.exe`
            - **macOS (Universal):** `Flux-${{ github.ref_name }}-macos-universal.zip` — unpack and run `Flux.app`
            - **Linux (Build from Source):** `make && sudo make install`

            ### Verification
            Verify downloads using the provided `.sha256` checksum files.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
