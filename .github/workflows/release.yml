name: Release Native Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable Package
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Flux UI web bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Build native release binaries
        run: cargo build --release --workspace --bins

      - name: Prepare Windows standalone package
        shell: powershell
        run: |
          $Version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v', '' } else { '1.0.0' }
          $PkgDir = "Flux-$Version-win-x64"
          New-Item -ItemType Directory -Force -Path $PkgDir
          New-Item -ItemType Directory -Force -Path "$PkgDir/licenses"
          New-Item -ItemType Directory -Force -Path "$PkgDir/tools"
          New-Item -ItemType Directory -Force -Path "$PkgDir/apps/web"

          # Copy binary
          if (Test-Path "target/release/flux.exe") {
            Copy-Item "target/release/flux.exe" -Destination "$PkgDir/Flux.exe"
          } else {
            $Found = Get-ChildItem -Recurse -Filter "flux.exe" target | Select-Object -First 1
            if ($Found) {
              Copy-Item $Found.FullName -Destination "$PkgDir/Flux.exe"
            } else {
              Write-Error "Native flux.exe binary not found!"
              exit 1
            }
          }

          # Copy complete Flux UI and assets into package
          Copy-Item -Recurse "apps/web/dist" "$PkgDir/apps/web/"
          Copy-Item -Recurse "apps/web/fonts" "$PkgDir/apps/web/"
          Copy-Item -Recurse "apps/web/icons" "$PkgDir/apps/web/"
          Copy-Item "apps/web/index.html" "$PkgDir/apps/web/"
          Copy-Item "apps/web/app.css" "$PkgDir/apps/web/"
          Copy-Item "apps/web/themes.css" "$PkgDir/apps/web/"
          Copy-Item "apps/web/fonts.css" "$PkgDir/apps/web/"
          Copy-Item "apps/web/manifest.webmanifest" "$PkgDir/apps/web/"

          # Copy documents and notices
          Copy-Item "LICENSES.md" -Destination "$PkgDir/licenses/NOTICES.txt"
          Copy-Item "README.md" -Destination "$PkgDir/README.txt"

          # Create portable flag file
          New-Item -ItemType File -Force -Path "$PkgDir/portable.flag"

          # Create zip package
          Compress-Archive -Path "$PkgDir/*" -DestinationPath "$PkgDir.zip" -Force
          Write-Output "PACKAGE_ZIP=$PkgDir.zip" >> $env:GITHUB_ENV
          Get-FileHash "$PkgDir.zip" -Algorithm SHA256 | Out-File "$PkgDir.zip.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: Flux-*-win-x64.zip*

  build-macos:
    name: Build macOS Universal Package
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Flux UI web bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Build native release binaries
        run: |
          cargo build --release --workspace --bins
          cargo build --release --target aarch64-apple-darwin --bin flux || true
          cargo build --release --target x86_64-apple-darwin --bin flux || true

      - name: Prepare macOS standalone package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION" = "$GITHUB_REF" ] && VERSION="1.0.0"
          PKG_NAME="Flux-v${VERSION}-macos-universal"
          mkdir -p "$PKG_NAME/Flux.app/Contents/MacOS"
          mkdir -p "$PKG_NAME/Flux.app/Contents/Resources/apps/web"

          # Choose Universal or host binary
          if [ -f target/aarch64-apple-darwin/release/flux ] && [ -f target/x86_64-apple-darwin/release/flux ]; then
            echo "[*] Creating Universal 2 binary with lipo..."
            lipo -create -output "$PKG_NAME/Flux.app/Contents/MacOS/Flux" \
              target/aarch64-apple-darwin/release/flux \
              target/x86_64-apple-darwin/release/flux
          elif [ -f target/release/flux ]; then
            cp target/release/flux "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
          elif [ -f target/aarch64-apple-darwin/release/flux ]; then
            cp target/aarch64-apple-darwin/release/flux "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
          else
            FOUND_BIN=$(find target -name "flux" -type f | head -n 1)
            if [ -n "$FOUND_BIN" ] && [ -f "$FOUND_BIN" ]; then
              cp "$FOUND_BIN" "$PKG_NAME/Flux.app/Contents/MacOS/Flux"
            else
              echo "Error: Native flux binary not found in target directories."
              exit 1
            fi
          fi
          chmod +x "$PKG_NAME/Flux.app/Contents/MacOS/Flux"

          # Copy complete Flux UI and assets into macOS bundle
          cp -r apps/web/dist "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp -r apps/web/fonts "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp -r apps/web/icons "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp apps/web/index.html "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp apps/web/app.css "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp apps/web/themes.css "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp apps/web/fonts.css "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"
          cp apps/web/manifest.webmanifest "$PKG_NAME/Flux.app/Contents/Resources/apps/web/"

          # Create macOS Info.plist bundle descriptor
          cat << 'EOF' > "$PKG_NAME/Flux.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Flux</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>in.solarquack.flux</string>
              <key>CFBundleName</key>
              <string>Flux</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          cp README.md "$PKG_NAME/README.txt"
          cp LICENSES.md "$PKG_NAME/LICENSES.txt"

          zip -r "${PKG_NAME}.zip" "$PKG_NAME"
          shasum -a 256 "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable-zip
          path: Flux-*-macos-universal.zip*

  build-linux:
    name: Build Linux x64 Portable Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Flux UI and Static Site
        run: |
          npm ci || npm install
          npm run build
          npm run build:static

      - name: Build Native Linux Binaries
        run: cargo build --release --workspace --bins

      - name: Package Linux tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION" = "$GITHUB_REF" ] && VERSION="1.0.0"
          PKG_NAME="Flux-v${VERSION}-linux-x64"
          mkdir -p "$PKG_NAME/apps/web"
          cp target/release/flux "$PKG_NAME/"
          cp -r apps/web/dist "$PKG_NAME/apps/web/"
          cp -r apps/web/fonts "$PKG_NAME/apps/web/"
          cp -r apps/web/icons "$PKG_NAME/apps/web/"
          cp apps/web/index.html "$PKG_NAME/apps/web/"
          cp apps/web/app.css "$PKG_NAME/apps/web/"
          cp apps/web/themes.css "$PKG_NAME/apps/web/"
          cp apps/web/fonts.css "$PKG_NAME/apps/web/"
          cp apps/web/manifest.webmanifest "$PKG_NAME/apps/web/"
          cp README.md "$PKG_NAME/README.txt"
          cp LICENSES.md "$PKG_NAME/LICENSES.txt"
          tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-tarball
          path: Flux-*-linux-x64.tar.gz*

  release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release version
        id: rel_ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            TAG="v1.0.0"
            VER="1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -laR release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flux v${{ steps.rel_ver.outputs.version }} — Native Standalone
          make_latest: true
          overwrite_files: true
          files: release-assets/*
          body: |
            ## Flux Native Audio Editor v${{ steps.rel_ver.outputs.version }}

            Standalone, self-contained native builds for Windows and macOS with all audio codecs and DSP primitives bundled.

            ### Downloads
            - **Windows (x64 Portable):** `Flux-${{ steps.rel_ver.outputs.version }}-win-x64.zip` — unpack anywhere and run `Flux.exe`
            - **macOS (Universal):** `Flux-v${{ steps.rel_ver.outputs.version }}-macos-universal.zip` — unpack and run `Flux.app`
            - **Linux (x64 Portable):** `Flux-v${{ steps.rel_ver.outputs.version }}-linux-x64.tar.gz` — unpack and run `./flux`, or build from source with `make && sudo make install`

            ### Verification
            Verify downloads using the provided `.sha256` checksum files.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
