name: CI

# The full local gate on every push and pull request. Caches (rust-cache for dependencies, sccache for every
# compiled crate, npm and pip) mean a push only recompiles what changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: Lint, test, UI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for the desktop shell and audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # sccache only saves time, so a failed download (GitHub answers 504 at times) must not fail the build.
      # Without annotations the action's post step has nothing to do, so it can't fail either.
      - id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        with:
          disable_annotations: "true"
      - name: Use sccache if it installed
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,typos-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Format
        run: cargo fmt --all --check
      - name: Spelling
        run: typos
      - name: Desktop sidecar (Tauri needs flux-mcp next to the app before it compiles)
        run: node scripts/sidecar.mjs
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Licences and advisories
        run: cargo deny check
      - name: Rust tests
        run: cargo test --workspace
      - name: Scripts parse
        run: npm run -s check:js
      - name: Site tests
        run: |
          npm run -s build:static
          npm run -s test:site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: UI end-to-end (real engine, null audio device)
        # The key tests use the real system keychain. A build machine has none running, so start one for this step.
        run: |
          sudo apt-get install -y gnome-keyring dbus
          cargo build -p flux-mcp --release
          dbus-run-session -- bash -c 'echo -n ci-only | gnome-keyring-daemon --unlock > /dev/null; npm run -s test:ui'
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: target/e2e/*.png
          if-no-files-found: ignore

  build:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # sccache only saves time, so a failed download (GitHub answers 504 at times) must not fail the build.
      # Without annotations the action's post step has nothing to do, so it can't fail either.
      - id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        with:
          disable_annotations: "true"
      - name: Use sccache if it installed
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-on-failure: true
      - name: Desktop sidecar (Tauri needs flux-mcp next to the app before it compiles)
        run: node scripts/sidecar.mjs
      - name: Rust tests
        run: cargo test --workspace
