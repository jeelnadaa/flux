<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Audio Analysis Foundations Test</title>
  </head>
  <body>
    <h1>Flux Analysis Foundations Test</h1>
    <div id="status">Running analysis tests...</div>
    <pre id="log"></pre>

    <script>
      function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
        console.log(msg);
      }

      class AnalysisManager {
        async buildPeakPyramid(samples, numChannels, baseBinSize = 64) {
          const numFrames = Math.floor(samples.length / numChannels);
          const binsCount = Math.ceil(numFrames / baseBinSize);
          const headerSize = 24 + 8;
          const bodySize = numChannels * binsCount * 12;
          const buffer = new ArrayBuffer(headerSize + bodySize);
          const view = new DataView(buffer);

          view.setUint8(0, 0x46);
          view.setUint8(1, 0x50);
          view.setUint8(2, 0x59);
          view.setUint8(3, 0x52);
          view.setUint16(4, 1, true);
          view.setUint16(6, numChannels, true);
          view.setUint32(8, baseBinSize, true);
          view.setBigUint64(12, BigInt(numFrames), true);
          view.setUint32(20, 1, true); // 1 level

          view.setUint32(24, baseBinSize, true);
          view.setUint32(28, binsCount, true);

          let offset = 32;
          for (let c = 0; c < numChannels; c++) {
            for (let b = 0; b < binsCount; b++) {
              let minVal = 1.0;
              let maxVal = -1.0;
              let sumSq = 0;
              const start = b * baseBinSize;
              const end = Math.min(numFrames, start + baseBinSize);
              const count = end - start;

              for (let f = start; f < end; f++) {
                const s = samples[f * numChannels + c];
                if (s < minVal) minVal = s;
                if (s > maxVal) maxVal = s;
                sumSq += s * s;
              }

              const rms = count > 0 ? Math.sqrt(sumSq / count) : 0;
              view.setFloat32(offset, minVal, true);
              view.setFloat32(offset + 4, maxVal, true);
              view.setFloat32(offset + 8, rms, true);
              offset += 12;
            }
          }

          return new Uint8Array(buffer);
        }

        queryPeakPyramid(pyramidBytes, channel, startFrame, endFrame, maxBins = 1024) {
          const view = new DataView(
            pyramidBytes.buffer,
            pyramidBytes.byteOffset,
            pyramidBytes.byteLength,
          );
          const numChannels = view.getUint16(6, true);
          const baseBinSize = view.getUint32(8, true);
          const binsCount = view.getUint32(28, true);

          const startBin = Math.min(binsCount, Math.floor(startFrame / baseBinSize));
          const endBin = Math.min(binsCount, Math.ceil(endFrame / baseBinSize));

          const bins = [];
          const channelOffset = 32 + channel * binsCount * 12;

          for (let b = startBin; b < endBin; b++) {
            const offset = channelOffset + b * 12;
            bins.push({
              min: view.getFloat32(offset, true),
              max: view.getFloat32(offset + 4, true),
              rms: view.getFloat32(offset + 8, true),
            });
          }

          return bins;
        }

        async measureLoudness(samples, numChannels, sampleRate) {
          let sumSq = 0;
          let maxPeak = 0;
          for (let i = 0; i < samples.length; i++) {
            const a = Math.abs(samples[i]);
            if (a > maxPeak) maxPeak = a;
            sumSq += samples[i] * samples[i];
          }
          const rms = Math.sqrt(sumSq / samples.length);
          const lufs = rms > 1e-7 ? -0.691 + 20 * Math.log10(rms) : -140.0;
          const tp = maxPeak > 1e-7 ? 20 * Math.log10(maxPeak) : -140.0;

          return {
            integratedLufs: lufs,
            maxMomentaryLufs: lufs,
            maxShortTermLufs: lufs,
            loudnessRangeLu: 0.0,
            maxTruePeakDbtp: tp,
            maxTruePeakLinear: maxPeak,
          };
        }

        async analyzeStereo(left, right, maxGoniometerPoints = 512) {
          let sumL2 = 0;
          let sumR2 = 0;
          let sumLR = 0;
          let sumMid2 = 0;
          let sumSide2 = 0;
          const n = Math.min(left.length, right.length);
          const invSqrt2 = 1.0 / Math.SQRT2;
          const step = Math.max(1, Math.floor(n / maxGoniometerPoints));
          const points = [];

          for (let i = 0; i < n; i++) {
            const l = left[i];
            const r = right[i];
            sumL2 += l * l;
            sumR2 += r * r;
            sumLR += l * r;

            const m = 0.5 * (l + r);
            const s = 0.5 * (l - r);
            sumMid2 += m * m;
            sumSide2 += s * s;

            if (i % step === 0 && points.length < maxGoniometerPoints) {
              points.push({
                x: (l - r) * invSqrt2,
                y: (l + r) * invSqrt2,
              });
            }
          }

          const denom = Math.sqrt(sumL2 * sumR2);
          const phase = denom > 1e-12 ? Math.max(-1.0, Math.min(1.0, sumLR / denom)) : 1.0;
          const midRms = Math.sqrt(sumMid2 / n);
          const sideRms = Math.sqrt(sumSide2 / n);
          const stereoWidth = midRms > 1e-7 ? sideRms / midRms : 0.0;

          return {
            phaseCorrelation: phase,
            stereoWidth,
            midRms,
            sideRms,
            goniometerPoints: points,
          };
        }
      }

      async function runTest() {
        try {
          log("Starting AnalysisManager tests in browser...");
          const manager = new AnalysisManager();

          // 1. Generate stereo test audio
          const frames = 4800;
          const samples = new Float32Array(frames * 2);
          const left = new Float32Array(frames);
          const right = new Float32Array(frames);

          for (let i = 0; i < frames; i++) {
            const s = Math.sin((2 * Math.PI * 1000 * i) / 48000) * 0.7;
            samples[i * 2] = s;
            samples[i * 2 + 1] = s;
            left[i] = s;
            right[i] = s;
          }

          // 2. Peak Pyramid Test
          const pyrBytes = await manager.buildPeakPyramid(samples, 2, 64);
          log(`Built pyramid: ${pyrBytes.length} bytes`);
          if (pyrBytes.length < 32) throw new Error("Pyramid too small");
          const magic = String.fromCharCode(...pyrBytes.slice(0, 4));
          if (magic !== "FPYR") throw new Error("Invalid FPYR header");

          const queried = manager.queryPeakPyramid(pyrBytes, 0, 0, 1000, 64);
          log(`Queried bins count: ${queried.length}`);
          if (queried.length === 0) throw new Error("Queried pyramid bins empty");

          // 3. Loudness Measurement Test
          const loudness = await manager.measureLoudness(samples, 2, 48000);
          log(
            `Measured Loudness: ${loudness.integratedLufs.toFixed(2)} LUFS, Peak: ${loudness.maxTruePeakDbtp.toFixed(2)} dBTP`,
          );
          if (loudness.integratedLufs <= -50) throw new Error("Loudness too low for 0.7 sine");

          // 4. Stereo Analysis Test (In-phase mono Left == Right -> correlation = 1.0)
          const stereo = await manager.analyzeStereo(left, right, 128);
          log(
            `Phase correlation: ${stereo.phaseCorrelation.toFixed(4)}, points: ${stereo.goniometerPoints.length}`,
          );
          if (Math.abs(stereo.phaseCorrelation - 1.0) > 0.001)
            throw new Error("Expected correlation 1.0 for Left == Right");
          if (stereo.goniometerPoints.length === 0) throw new Error("Goniometer points empty");

          document.getElementById("status").textContent = "Pass";
          window.analysisTestResult = {
            success: true,
            pyramidBytes: pyrBytes.length,
            queriedBinsCount: queried.length,
            loudnessLufs: loudness.integratedLufs,
            phaseCorrelation: stereo.phaseCorrelation,
            goniometerPointsCount: stereo.goniometerPoints.length,
          };
          log("All analysis tests passed successfully!");
        } catch (err) {
          log("Test failed: " + err);
          document.getElementById("status").textContent = "Fail: " + err;
          window.analysisTestResult = {
            success: false,
            error: String(err),
          };
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        runTest();
      });
    </script>
  </body>
</html>
