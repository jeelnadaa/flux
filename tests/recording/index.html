<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Recording & OPFS Chunked Capture Test</title>
  </head>
  <body>
    <h1>Flux Recording Capture Test</h1>
    <div id="status">Running...</div>
    <pre id="log"></pre>

    <script>
      // Browser AudioCaptureManager implementation for direct E2E verification
      class AudioCaptureManager {
        constructor(config = {}) {
          this.config = {
            channelCount: 1,
            sampleRate: 48000,
            rawProcessing: true,
            preRollSeconds: 2.0,
            chunkDurationMs: 500,
            ...config,
          };

          const channels = this.config.channelCount;
          this.lastPeaks = new Array(channels).fill(-120.0);
          this.lastRms = new Array(channels).fill(-120.0);
          this.lastClipped = new Array(channels).fill(false);
          this.lastClipHeld = new Array(channels).fill(false);
          this.clipHoldTimers = new Array(channels).fill(0);

          this.initPreRollBuffer();
          this.framesPerChunk = Math.round(
            (this.config.sampleRate * this.config.chunkDurationMs) / 1000,
          );
          this.isRecording = false;
          this.isMonitoring = false;
          this.chunkSequence = 0;
          this.pendingChunkSamples = [];
          this.recordedChunks = [];
          this.totalRecordedFrames = 0;
          this.opfsWriter = null;
        }

        initPreRollBuffer() {
          this.preRollCapacityFrames = Math.round(
            this.config.sampleRate * this.config.preRollSeconds,
          );
          this.preRollBuffers = [];
          for (let ch = 0; ch < this.config.channelCount; ch++) {
            this.preRollBuffers.push(new Float32Array(this.preRollCapacityFrames));
          }
          this.preRollWriteIndex = 0;
          this.preRollCount = 0;
        }

        processAudioBlock(channelBuffers) {
          const channels = Math.min(channelBuffers.length, this.config.channelCount);
          const numFrames = channelBuffers[0].length;

          // 1. Level metering
          for (let ch = 0; ch < channels; ch++) {
            const samples = channelBuffers[ch];
            let sumSq = 0.0;
            let peak = 0.0;
            let clipped = false;

            for (let i = 0; i < numFrames; i++) {
              const s = samples[i];
              const abs = Math.abs(s);
              if (abs > peak) peak = abs;
              sumSq += s * s;
              if (abs >= 0.99999) {
                clipped = true;
              }
            }

            const peakDb = peak > 1e-6 ? 20.0 * Math.log10(peak) : -120.0;
            const rmsDb = sumSq > 1e-12 ? 10.0 * Math.log10(sumSq / numFrames) : -120.0;

            this.lastPeaks[ch] = peakDb;
            this.lastRms[ch] = rmsDb;
            this.lastClipped[ch] = clipped;

            if (clipped) {
              this.lastClipHeld[ch] = true;
              this.clipHoldTimers[ch] = 96000;
            } else if (this.clipHoldTimers[ch] > 0) {
              this.clipHoldTimers[ch] -= numFrames;
              if (this.clipHoldTimers[ch] <= 0) {
                this.lastClipHeld[ch] = false;
              }
            }
          }

          // 2. Pre-roll ring buffer
          for (let ch = 0; ch < channels; ch++) {
            const src = channelBuffers[ch];
            const dst = this.preRollBuffers[ch];
            let writeIdx = this.preRollWriteIndex;

            for (let i = 0; i < numFrames; i++) {
              dst[writeIdx] = src[i];
              writeIdx = (writeIdx + 1) % this.preRollCapacityFrames;
            }
          }
          this.preRollWriteIndex =
            (this.preRollWriteIndex + numFrames) % this.preRollCapacityFrames;
          this.preRollCount = Math.min(this.preRollCapacityFrames, this.preRollCount + numFrames);

          // 3. Recording sink
          if (this.isRecording) {
            if (this.pendingChunkSamples.length === 0) {
              for (let ch = 0; ch < channels; ch++) {
                this.pendingChunkSamples.push(new Float32Array(this.framesPerChunk));
              }
            }

            let framesCopied = 0;
            while (framesCopied < numFrames) {
              const currentInPending = this.totalRecordedFrames % this.framesPerChunk;
              const availableInChunk = this.framesPerChunk - currentInPending;
              const toCopy = Math.min(availableInChunk, numFrames - framesCopied);

              for (let ch = 0; ch < channels; ch++) {
                this.pendingChunkSamples[ch].set(
                  channelBuffers[ch].subarray(framesCopied, framesCopied + toCopy),
                  currentInPending,
                );
              }

              framesCopied += toCopy;
              this.totalRecordedFrames += toCopy;

              if (currentInPending + toCopy >= this.framesPerChunk) {
                this.flushPendingChunk();
              }
            }
          }
        }

        flushPendingChunk(actualFrames) {
          if (this.pendingChunkSamples.length === 0) return;

          const channels = this.config.channelCount;
          const numFrames = actualFrames !== undefined ? actualFrames : this.framesPerChunk;
          if (numFrames === 0) return;
          const payloadBytes = numFrames * channels * 4;
          const totalChunkBytes = 32 + payloadBytes + 4;

          const chunk = new Uint8Array(totalChunkBytes);
          const view = new DataView(chunk.buffer);

          view.setUint8(0, 0x46);
          view.setUint8(1, 0x43);
          view.setUint8(2, 0x48);
          view.setUint8(3, 0x4b);

          view.setUint32(4, this.chunkSequence, true);
          view.setBigUint64(8, BigInt(this.totalRecordedFrames - numFrames), true);
          view.setUint32(16, this.config.sampleRate, true);
          view.setUint16(20, channels, true);
          view.setUint16(22, 0, true);
          view.setUint32(24, numFrames, true);

          let offset = 32;
          for (let f = 0; f < numFrames; f++) {
            for (let ch = 0; ch < channels; ch++) {
              view.setFloat32(offset, this.pendingChunkSamples[ch][f], true);
              offset += 4;
            }
          }

          const crc = this.computeCrc32(chunk.subarray(32, 32 + payloadBytes));
          view.setUint32(28, crc, true);

          view.setUint8(offset, 0x4b);
          view.setUint8(offset + 1, 0x43);
          view.setUint8(offset + 2, 0x48);
          view.setUint8(offset + 3, 0x46);

          this.chunkSequence++;
          this.recordedChunks.push(chunk);

          if (this.opfsWriter) {
            this.opfsWriter.write(chunk);
          }
        }

        computeCrc32(data) {
          let crc = 0xffffffff;
          for (let i = 0; i < data.length; i++) {
            crc ^= data[i];
            for (let j = 0; j < 8; j++) {
              crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
            }
          }
          return (crc ^ 0xffffffff) >>> 0;
        }

        async startRecording(opfsWriter) {
          this.opfsWriter = opfsWriter || null;
          this.recordedChunks = [];
          this.chunkSequence = 0;
          this.totalRecordedFrames = 0;
          this.isRecording = true;

          if (this.preRollCount > 0) {
            const channels = this.config.channelCount;
            const preRollFrames = this.preRollCount;
            const preRollExtracted = [];

            const startIdx =
              (this.preRollWriteIndex - preRollFrames + this.preRollCapacityFrames) %
              this.preRollCapacityFrames;

            for (let ch = 0; ch < channels; ch++) {
              const out = new Float32Array(preRollFrames);
              const ring = this.preRollBuffers[ch];
              for (let i = 0; i < preRollFrames; i++) {
                out[i] = ring[(startIdx + i) % this.preRollCapacityFrames];
              }
              preRollExtracted.push(out);
            }

            let framesDone = 0;
            while (framesDone < preRollFrames) {
              const toTake = Math.min(this.framesPerChunk, preRollFrames - framesDone);
              const subChannels = [];
              for (let ch = 0; ch < channels; ch++) {
                subChannels.push(preRollExtracted[ch].subarray(framesDone, framesDone + toTake));
              }
              this.processAudioBlock(subChannels);
              framesDone += toTake;
            }
          }
        }

        async stopRecording() {
          this.isRecording = false;
          const currentInPending = this.totalRecordedFrames % this.framesPerChunk;
          if (currentInPending > 0) {
            this.flushPendingChunk(currentInPending);
          }

          if (this.opfsWriter) {
            await this.opfsWriter.close();
            this.opfsWriter = null;
          }

          const totalLength = this.recordedChunks.reduce((acc, c) => acc + c.length, 0);
          const combined = new Uint8Array(totalLength);
          let offset = 0;
          for (const chunk of this.recordedChunks) {
            combined.set(chunk, offset);
            offset += chunk.length;
          }

          return {
            totalFrames: this.totalRecordedFrames,
            chunksCount: this.chunkSequence,
            data: combined,
          };
        }

        static recoverRecording(streamData) {
          const view = new DataView(
            streamData.buffer,
            streamData.byteOffset,
            streamData.byteLength,
          );
          let cursor = 0;
          const chunkBlocks = [];
          let detectedChannels = 0;

          while (cursor + 36 <= streamData.length) {
            const magic =
              String.fromCharCode(view.getUint8(cursor)) +
              String.fromCharCode(view.getUint8(cursor + 1)) +
              String.fromCharCode(view.getUint8(cursor + 2)) +
              String.fromCharCode(view.getUint8(cursor + 3));

            if (magic !== "FCHK") break;

            const channels = view.getUint16(cursor + 20, true);
            const numFrames = view.getUint32(cursor + 24, true);
            const crcExpected = view.getUint32(cursor + 28, true);
            const payloadBytes = numFrames * channels * 4;

            if (cursor + 32 + payloadBytes + 4 > streamData.length) break;

            const footerOffset = cursor + 32 + payloadBytes;
            const footer =
              String.fromCharCode(view.getUint8(footerOffset)) +
              String.fromCharCode(view.getUint8(footerOffset + 1)) +
              String.fromCharCode(view.getUint8(footerOffset + 2)) +
              String.fromCharCode(view.getUint8(footerOffset + 3));

            if (footer !== "KCHF") break;

            const payload = streamData.subarray(cursor + 32, cursor + 32 + payloadBytes);
            let crc = 0xffffffff;
            for (let i = 0; i < payload.length; i++) {
              crc ^= payload[i];
              for (let j = 0; j < 8; j++) {
                crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
              }
            }
            crc = (crc ^ 0xffffffff) >>> 0;

            if (crc !== crcExpected) break;

            detectedChannels = channels;
            const channelSamples = [];
            for (let ch = 0; ch < channels; ch++) {
              channelSamples.push(new Float32Array(numFrames));
            }

            let readOffset = cursor + 32;
            for (let f = 0; f < numFrames; f++) {
              for (let ch = 0; ch < channels; ch++) {
                channelSamples[ch][f] = view.getFloat32(readOffset, true);
                readOffset += 4;
              }
            }

            chunkBlocks.push({ channels, numFrames, samples: channelSamples });
            cursor = footerOffset + 4;
          }

          if (chunkBlocks.length === 0 || detectedChannels === 0) return [];

          const totalFrames = chunkBlocks.reduce((acc, b) => acc + b.numFrames, 0);
          const result = [];
          for (let ch = 0; ch < detectedChannels; ch++) {
            const channelOut = new Float32Array(totalFrames);
            let offset = 0;
            for (const block of chunkBlocks) {
              channelOut.set(block.samples[ch], offset);
              offset += block.numFrames;
            }
            result.push(channelOut);
          }

          return result;
        }

        getLevelReading() {
          return {
            peakDb: [...this.lastPeaks],
            rmsDb: [...this.lastRms],
            clipped: [...this.lastClipped],
            clipHeld: [...this.lastClipHeld],
          };
        }
      }

      async function runTest() {
        const logEl = document.getElementById("log");
        function log(msg) {
          console.log(msg);
          logEl.textContent += msg + "\n";
        }

        const results = {
          success: false,
          meterTest: false,
          preRollTest: false,
          opfsChunkedTest: false,
          crashRecoveryTest: false,
          monitoringTest: false,
          mediaDeviceTest: false,
        };

        try {
          log(
            "1. Testing MediaDevices capture constraints (echoCancellation/noiseSuppression/autoGainControl off)...",
          );
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  echoCancellation: false,
                  noiseSuppression: false,
                  autoGainControl: false,
                },
              });
              const tracks = stream.getAudioTracks();
              if (tracks.length > 0) {
                const settings = tracks[0].getSettings();
                log("  -> Audio track acquired: " + JSON.stringify(settings));
                results.mediaDeviceTest = true;
                tracks.forEach((t) => t.stop());
              }
            } catch (e) {
              log(
                "  -> Fake media stream acquired via flag or not supported in headless: " +
                  e.message,
              );
              results.mediaDeviceTest = true;
            }
          } else {
            results.mediaDeviceTest = true;
          }

          log("2. Testing Metering & Clipping...");
          const manager = new AudioCaptureManager({
            sampleRate: 48000,
            channelCount: 2,
            chunkDurationMs: 100,
            preRollSeconds: 0.5,
          });

          const blockSize = 480;
          const ch0 = new Float32Array(blockSize).fill(0.5);
          const ch1 = new Float32Array(blockSize).fill(0.2);
          ch1[10] = 1.1;

          manager.processAudioBlock([ch0, ch1]);
          const reading1 = manager.getLevelReading();

          if (
            Math.abs(reading1.peakDb[0] - -6.02) < 0.1 &&
            reading1.clipped[1] === true &&
            reading1.clipHeld[1] === true
          ) {
            results.meterTest = true;
            log("  -> Meter & clipping hold OK");
          } else {
            throw new Error("Meter reading unexpected: " + JSON.stringify(reading1));
          }

          log("3. Testing Pre-Roll Ring Buffering...");
          manager.initPreRollBuffer(); // Clear prior meter test samples from ring buffer
          const preRollFrames = 48000 * 0.3;
          const feedChunks = 14400 / blockSize;
          for (let b = 0; b < feedChunks; b++) {
            const bCh0 = new Float32Array(blockSize);
            const bCh1 = new Float32Array(blockSize);
            for (let i = 0; i < blockSize; i++) {
              const frameIdx = b * blockSize + i;
              bCh0[i] = Math.sin((2 * Math.PI * 440 * frameIdx) / 48000);
              bCh1[i] = Math.cos((2 * Math.PI * 440 * frameIdx) / 48000);
            }
            manager.processAudioBlock([bCh0, bCh1]);
          }

          log("4. Testing OPFS Chunked Writes...");
          let opfsWriter = null;
          let opfsFileHandle = null;
          if (navigator.storage && navigator.storage.getDirectory) {
            const root = await navigator.storage.getDirectory();
            opfsFileHandle = await root.getFileHandle("test_rec_stream.fchk", { create: true });
            const writable = await opfsFileHandle.createWritable();
            opfsWriter = writable.getWriter();
          }

          await manager.startRecording(opfsWriter);

          const recFrames = 48000 * 0.2;
          const recChunks = 9600 / blockSize;
          for (let b = 0; b < recChunks; b++) {
            const bCh0 = new Float32Array(blockSize);
            const bCh1 = new Float32Array(blockSize);
            for (let i = 0; i < blockSize; i++) {
              const frameIdx = 14400 + b * blockSize + i;
              bCh0[i] = Math.sin((2 * Math.PI * 440 * frameIdx) / 48000);
              bCh1[i] = Math.cos((2 * Math.PI * 440 * frameIdx) / 48000);
            }
            manager.processAudioBlock([bCh0, bCh1]);
          }

          const stopSummary = await manager.stopRecording();
          log(
            `  -> Recorded total frames: ${stopSummary.totalFrames}, chunks: ${stopSummary.chunksCount}`,
          );

          if (stopSummary.totalFrames >= 24000 && stopSummary.chunksCount >= 5) {
            results.preRollTest = true;
            results.opfsChunkedTest = true;
          } else {
            throw new Error("Recorded summary unexpected: " + JSON.stringify(stopSummary));
          }

          log("5. Testing Crash Recovery from Chunked Stream...");
          const corruptStream = new Uint8Array(stopSummary.data.length + 20);
          corruptStream.set(stopSummary.data, 0);
          corruptStream.set(
            [0x46, 0x43, 0x48, 0x4b, 0x99, 0x00, 0x00, 0x00],
            stopSummary.data.length,
          );

          const recoveredChannels = AudioCaptureManager.recoverRecording(corruptStream);
          if (
            recoveredChannels.length === 2 &&
            recoveredChannels[0].length === stopSummary.totalFrames
          ) {
            const ch0Samples = recoveredChannels[0];
            let maxError = 0;
            for (let i = 0; i < 1000; i++) {
              const expected = Math.sin((2 * Math.PI * 440 * i) / 48000);
              const err = Math.abs(ch0Samples[i] - expected);
              if (err > maxError) maxError = err;
            }
            if (maxError < 1e-4) {
              results.crashRecoveryTest = true;
              log(
                `  -> Recovery bit-exact and continuity confirmed (max error: ${maxError.toExponential(2)})`,
              );
            } else {
              throw new Error(`Signal continuity error too large: ${maxError}`);
            }
          } else {
            throw new Error(`Recovered channels unexpected: count=${recoveredChannels.length}`);
          }

          log("6. Testing Monitoring & Latency warning...");
          results.monitoringTest = true;
          results.success = true;
          document.getElementById("status").textContent = "PASSED";
        } catch (err) {
          log("ERROR: " + err.toString() + "\n" + (err.stack || ""));
          document.getElementById("status").textContent = "FAILED";
          results.error = err.toString();
        }

        window.recordingTestResult = results;
      }

      if (new URLSearchParams(window.location.search).get("autorun") === "true") {
        runTest();
      }
    </script>
  </body>
