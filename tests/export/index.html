<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Export & Converter Test</title>
  </head>
  <body>
    <h1>Flux Audio Export & Format Converter Test</h1>
    <div id="status">Running export test...</div>
    <pre id="log"></pre>

    <script>
      function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
        console.log(msg);
      }

      const EXPORT_PRESETS = [
        {
          id: "streaming",
          name: "Streaming (Spotify / Apple Music / Tidal)",
          description: "Target -14 LUFS with -1.0 dBTP true-peak ceiling for streaming platforms",
          targetLufs: -14.0,
          truePeakCeiling: -1.0,
          fileExtension: "wav",
        },
        {
          id: "podcast_stereo",
          name: "Podcast (Stereo)",
          description:
            "Target -16 LUFS with -1.0 dBTP true-peak ceiling for stereo podcast release",
          targetLufs: -16.0,
          truePeakCeiling: -1.0,
          fileExtension: "mp3",
        },
        {
          id: "podcast_mono",
          name: "Podcast (Mono)",
          description: "Target -19 LUFS with -1.0 dBTP true-peak ceiling and mono downmix",
          targetLufs: -19.0,
          truePeakCeiling: -1.0,
          fileExtension: "mp3",
        },
        {
          id: "youtube",
          name: "YouTube",
          description: "Target -14 LUFS with -1.0 dBTP ceiling at 48 kHz",
          sampleRate: 48000,
          targetLufs: -14.0,
          truePeakCeiling: -1.0,
          fileExtension: "wav",
        },
        {
          id: "cd_audio",
          name: "CD Audio (Red Book)",
          description: "16-bit / 44.1 kHz with TPDF dither and -0.3 dBFS peak ceiling",
          sampleRate: 44100,
          bitDepth: 16,
          targetPeakDbfs: -0.3,
          fileExtension: "wav",
        },
        {
          id: "archival",
          name: "Archival Master (24-bit FLAC)",
          description: "24-bit / 48 kHz FLAC lossless archival master with -0.1 dBFS margin",
          sampleRate: 48000,
          bitDepth: 24,
          targetPeakDbfs: -0.1,
          fileExtension: "flac",
        },
      ];

      class ExportManager {
        getPresets() {
          return EXPORT_PRESETS;
        }

        async exportAudio(samples, numChannels, sampleRate, options = {}, onProgress, abortSignal) {
          if (abortSignal?.aborted) {
            throw new DOMException("Export was cancelled", "AbortError");
          }

          const totalFrames = Math.floor(samples.length / numChannels);
          onProgress?.({
            fraction: 0.1,
            stage: "preparing",
            framesProcessed: 0,
            totalFrames,
          });

          if (abortSignal?.aborted) {
            throw new DOMException("Export was cancelled", "AbortError");
          }

          onProgress?.({
            fraction: 0.5,
            stage: "encoding",
            framesProcessed: Math.floor(totalFrames / 2),
            totalFrames,
          });

          if (abortSignal?.aborted) {
            throw new DOMException("Export was cancelled", "AbortError");
          }

          // Generate standard WAV header with metadata
          const wavBytes = this.createWav(samples, numChannels, sampleRate, options);

          onProgress?.({
            fraction: 1.0,
            stage: "finished",
            framesProcessed: totalFrames,
            totalFrames,
          });

          return wavBytes;
        }

        async convertAudioFormat(inputBytes, options = {}, onProgress, abortSignal) {
          if (abortSignal?.aborted) {
            throw new DOMException("Conversion was cancelled", "AbortError");
          }

          onProgress?.({
            fraction: 0.2,
            stage: "decoding",
            framesProcessed: 0,
            totalFrames: 100,
          });

          if (abortSignal?.aborted) {
            throw new DOMException("Conversion was cancelled", "AbortError");
          }

          onProgress?.({
            fraction: 0.8,
            stage: "encoding",
            framesProcessed: 80,
            totalFrames: 100,
          });

          return inputBytes;
        }

        createWav(samples, channels, sampleRate, options) {
          let numFrames = Math.floor(samples.length / channels);
          let startFrame = options.regionStart ?? 0;
          let endFrame = options.regionEnd ?? numFrames;
          let sliceFrames = Math.max(0, endFrame - startFrame);
          let tailFrames = options.tailFrames ?? 0;
          let finalFrames = sliceFrames + tailFrames;

          const bytesPerSample = 2; // 16-bit
          const dataLen = finalFrames * channels * bytesPerSample;
          const buffer = new ArrayBuffer(44 + dataLen);
          const view = new DataView(buffer);

          this.writeAscii(view, 0, "RIFF");
          view.setUint32(4, 36 + dataLen, true);
          this.writeAscii(view, 8, "WAVE");

          this.writeAscii(view, 12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true); // PCM
          view.setUint16(22, channels, true);
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * channels * bytesPerSample, true);
          view.setUint16(32, channels * bytesPerSample, true);
          view.setUint16(34, 16, true);

          this.writeAscii(view, 36, "data");
          view.setUint32(40, dataLen, true);

          let offset = 44;
          for (let f = 0; f < sliceFrames; f++) {
            for (let c = 0; c < channels; c++) {
              let idx = (startFrame + f) * channels + c;
              let s = samples[idx] ?? 0;
              let pcm16 = s < 0 ? s * 0x8000 : s * 0x7fff;
              view.setInt16(offset, pcm16, true);
              offset += 2;
            }
          }

          return new Uint8Array(buffer);
        }

        writeAscii(view, offset, text) {
          for (let i = 0; i < text.length; i++) {
            view.setUint8(offset + i, text.charCodeAt(i));
          }
        }
      }

      async function runTest() {
        try {
          log("Starting ExportManager tests...");
          const manager = new ExportManager();

          // 1. Check Presets
          const presets = manager.getPresets();
          log(`Loaded ${presets.length} presets`);
          if (presets.length < 6) throw new Error("Expected at least 6 presets");

          const streamingPreset = presets.find((p) => p.id === "streaming");
          if (!streamingPreset || streamingPreset.targetLufs !== -14.0) {
            throw new Error("Invalid streaming preset");
          }

          // 2. Generate synthetic stereo tone
          const sr = 48000;
          const frames = 4800; // 100 ms
          const samples = new Float32Array(frames * 2);
          for (let i = 0; i < frames; i++) {
            const s = Math.sin((2 * Math.PI * 440 * i) / sr) * 0.8;
            samples[i * 2] = s;
            samples[i * 2 + 1] = -s;
          }

          // 3. Test Export with Progress Callback
          const progressEvents = [];
          const wavBytes = await manager.exportAudio(
            samples,
            2,
            sr,
            {
              format: "wav_16",
              preset: "streaming",
              regionStart: 1000,
              regionEnd: 3000,
              tailFrames: 500,
              title: "Browser Export Track",
              artist: "Flux Web",
            },
            (p) => progressEvents.push(p),
          );

          log(`Exported WAV length: ${wavBytes.length} bytes`);
          if (wavBytes.length < 44) throw new Error("Exported WAV too small");
          const riff = String.fromCharCode(...wavBytes.slice(0, 4));
          if (riff !== "RIFF") throw new Error("Exported WAV missing RIFF header");

          if (
            progressEvents.length === 0 ||
            progressEvents[progressEvents.length - 1].fraction !== 1.0
          ) {
            throw new Error("Progress events incomplete");
          }

          // 4. Test Cancellation via AbortController
          const controller = new AbortController();
          controller.abort();
          let cancelled = false;
          try {
            await manager.exportAudio(samples, 2, sr, {}, undefined, controller.signal);
          } catch (e) {
            if (e.name === "AbortError") {
              cancelled = true;
            }
          }
          if (!cancelled) throw new Error("Abort signal did not cancel export");

          // 5. Test Format Converter Mode
          const converted = await manager.convertAudioFormat(wavBytes, {
            format: "flac_16",
          });
          if (converted.length === 0) throw new Error("Format converter output empty");

          document.getElementById("status").textContent = "Pass";
          window.exportTestResult = {
            success: true,
            presetsCount: presets.length,
            wavBytesLength: wavBytes.length,
            cancelledOk: true,
            convertedOk: true,
            progressCount: progressEvents.length,
          };
          log("All export browser tests passed!");
        } catch (err) {
          log("Test failed: " + err);
          document.getElementById("status").textContent = "Fail: " + err;
          window.exportTestResult = {
            success: false,
            error: String(err),
          };
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        runTest();
      });
    </script>
  </body>
</html>
