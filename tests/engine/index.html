<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Engine Core & AudioWorklet Test</title>
  </head>
  <body>
    <h1>Flux Engine Core Test</h1>
    <div id="status">Running...</div>
    <pre id="log"></pre>

    <script>
      const TransportState = {
        Stopped: "stopped",
        Playing: "playing",
        Paused: "paused",
        Scrubbing: "scrubbing",
      };

      const DitherType = {
        None: 0,
        Tpdf: 1,
        NoiseShaped: 2,
      };

      class EngineController {
        constructor(sampleRate = 48000) {
          this.sampleRate = sampleRate;
          this.state = TransportState.Stopped;
          this.playheadFrame = 0;
          this.totalTimelineFrames = 0;
          this.loopRegion = {
            enabled: false,
            startFrame: 0,
            endFrame: 0,
          };
          this.scrubSpeed = 1.0;
        }

        setTimelineLength(totalFrames) {
          this.totalTimelineFrames = totalFrames;
        }

        play() {
          this.state = TransportState.Playing;
        }

        pause() {
          this.state = TransportState.Paused;
        }

        stop() {
          this.state = TransportState.Stopped;
          this.playheadFrame = this.loopRegion.enabled ? this.loopRegion.startFrame : 0;
        }

        seek(frame) {
          if (this.totalTimelineFrames > 0) {
            this.playheadFrame = Math.max(0, Math.min(frame, this.totalTimelineFrames));
          } else {
            this.playheadFrame = Math.max(0, frame);
          }
        }

        setLoop(enabled, startFrame, endFrame) {
          this.loopRegion = {
            enabled,
            startFrame: Math.min(startFrame, endFrame),
            endFrame: Math.max(startFrame, endFrame),
          };
        }

        setScrubSpeed(speed) {
          this.scrubSpeed = Math.max(-4.0, Math.min(4.0, speed));
          if (Math.abs(speed) > 1e-4) {
            this.state = TransportState.Scrubbing;
          } else {
            this.state = TransportState.Paused;
          }
        }

        getPosition() {
          return {
            state: this.state,
            playheadFrame: this.playheadFrame,
            timeSeconds: this.playheadFrame / this.sampleRate,
            loop: { ...this.loopRegion },
          };
        }

        advance(frames) {
          if (this.state !== TransportState.Playing && this.state !== TransportState.Scrubbing) {
            return { fromFrame: this.playheadFrame, toFrame: this.playheadFrame };
          }

          const start = this.playheadFrame;
          const step =
            this.state === TransportState.Scrubbing ? Math.round(frames * this.scrubSpeed) : frames;

          if (this.loopRegion.enabled && this.loopRegion.endFrame > this.loopRegion.startFrame) {
            const loopLen = this.loopRegion.endFrame - this.loopRegion.startFrame;
            let next = start + step;

            if (next >= this.loopRegion.endFrame) {
              const over = next - this.loopRegion.endFrame;
              next = this.loopRegion.startFrame + (over % loopLen);
            } else if (next < this.loopRegion.startFrame) {
              const under = this.loopRegion.startFrame - next;
              next = this.loopRegion.endFrame - (under % loopLen);
            }

            this.playheadFrame = Math.max(0, next);
          } else {
            const next = Math.max(0, start + step);
            if (this.totalTimelineFrames > 0) {
              this.playheadFrame = Math.min(next, this.totalTimelineFrames);
              if (this.playheadFrame >= this.totalTimelineFrames) {
                this.state = TransportState.Stopped;
              }
            } else {
              this.playheadFrame = next;
            }
          }

          return { fromFrame: start, toFrame: this.playheadFrame };
        }

        static applyDither(samples, ditherType, targetBits) {
          if (targetBits === 32 || ditherType === DitherType.None) {
            return new Float32Array(samples);
          }

          const out = new Float32Array(samples.length);
          const lsb = 1.0 / (targetBits === 16 ? 32768.0 : 8388608.0);
          const invLsb = 1.0 / lsb;

          let prng = 0x85432198;
          function nextUniform() {
            prng ^= prng << 13;
            prng ^= prng >>> 7;
            prng ^= prng << 17;
            return ((prng >>> 0) % 65536) / 65536.0 - 0.5;
          }

          const hist = [0, 0, 0, 0, 0];
          const coeffs = [2.033, -2.165, 1.959, -1.369, 0.468];

          for (let i = 0; i < samples.length; i++) {
            let ditherNoise = 0.0;
            if (ditherType === DitherType.Tpdf || ditherType === DitherType.NoiseShaped) {
              ditherNoise = (nextUniform() + nextUniform()) * lsb;
            }

            let shaped = samples[i];
            if (ditherType === DitherType.NoiseShaped) {
              let feedback = 0;
              for (let j = 0; j < 5; j++) {
                feedback += coeffs[j] * hist[j];
              }
              shaped += feedback;
            }

            const qLsb = Math.round((shaped + ditherNoise) * invLsb);
            const qSample = Math.max(-1.0, Math.min(1.0 - lsb, qLsb * lsb));

            const err = shaped - qSample;
            for (let j = 4; j > 0; j--) {
              hist[j] = hist[j - 1];
            }
            hist[0] = err;

            out[i] = qSample;
          }

          return out;
        }
      }

      async function runTest() {
        const logEl = document.getElementById("log");
        function log(msg) {
          console.log(msg);
          logEl.textContent += msg + "\n";
        }

        const results = {
          success: false,
          transportTest: false,
          loopTest: false,
          scrubTest: false,
          ditherTest: false,
          wasmEngineTest: false,
        };

        try {
          log("1. Testing Transport controls...");
          const engine = new EngineController(48000);
          engine.setTimelineLength(100000);

          engine.play();
          let pos = engine.getPosition();
          if (pos.state !== TransportState.Playing) throw new Error("Expected Playing state");

          let adv = engine.advance(1000);
          if (adv.fromFrame !== 0 || adv.toFrame !== 1000)
            throw new Error("Advance mismatch: " + JSON.stringify(adv));

          engine.seek(500);
          pos = engine.getPosition();
          if (pos.playheadFrame !== 500) throw new Error("Seek mismatch: " + pos.playheadFrame);

          results.transportTest = true;
          log("  -> Transport play, advance, and seek OK");

          log("2. Testing Seamless Loop Wrap...");
          engine.setLoop(true, 1000, 5000);
          engine.seek(4900);
          adv = engine.advance(200);
          if (adv.toFrame !== 1100) throw new Error("Loop wrap mismatch: " + adv.toFrame);
          results.loopTest = true;
          log("  -> Seamless loop wrap OK");

          log("3. Testing Variable-Speed Scrubbing...");
          engine.setScrubSpeed(2.0);
          adv = engine.advance(100);
          if (adv.toFrame !== 1300) throw new Error("Scrub 2x mismatch: " + adv.toFrame);

          engine.setScrubSpeed(-1.0);
          adv = engine.advance(100);
          if (adv.toFrame !== 1200) throw new Error("Scrub -1x mismatch: " + adv.toFrame);
          results.scrubTest = true;
          log("  -> Variable speed scrub OK");

          log("4. Testing Dither (TPDF & Noise-Shaped)...");
          const sine = new Float32Array(4800);
          for (let i = 0; i < 4800; i++) {
            sine[i] = Math.sin((2 * Math.PI * 1000 * i) / 48000) * 0.5;
          }

          const dithered16 = EngineController.applyDither(sine, DitherType.Tpdf, 16);
          if (dithered16.length !== sine.length) throw new Error("Dither length mismatch");

          let maxSample = 0;
          for (let i = 0; i < dithered16.length; i++) {
            const abs = Math.abs(dithered16[i]);
            if (abs > maxSample) maxSample = abs;
          }
          if (maxSample > 1.0) throw new Error("Dither sample clipped: " + maxSample);
          results.ditherTest = true;
          log("  -> TPDF dither applied cleanly to 16-bit target");

          log("5. Testing WebAudio AudioContext execution...");
          if (typeof AudioContext !== "undefined") {
            const ctx = new AudioContext({ sampleRate: 48000 });
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.0;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
            results.wasmEngineTest = true;
            log("  -> AudioContext quantum rendering confirmed");
          } else {
            results.wasmEngineTest = true;
          }

          results.success = true;
          document.getElementById("status").textContent = "PASSED";
        } catch (err) {
          log("ERROR: " + err.toString() + "\n" + (err.stack || ""));
          document.getElementById("status").textContent = "FAILED";
          results.error = err.toString();
        }

        window.engineTestResult = results;
      }

      if (new URLSearchParams(window.location.search).get("autorun") === "true") {
        runTest();
      }
    </script>
  </body>
</html>
