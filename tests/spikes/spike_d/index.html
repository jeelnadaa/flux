<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Spike D: 2-Hour WAV Scrubbing with OPFS &amp; Peak Pyramid</title>
  </head>
  <body>
    <h1>Flux Spike D: OPFS Streaming &amp; Peak Zoom</h1>
    <div id="status">Ready</div>
    <pre id="output"></pre>

    <script>
      async function runSpikeDTest() {
        const outputEl = document.getElementById("output");
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Running...";

        function log(msg) {
          console.log(msg);
          outputEl.textContent += msg + "\n";
        }

        try {
          if (!navigator.storage || !navigator.storage.getDirectory) {
            throw new Error("OPFS (navigator.storage.getDirectory) is not available");
          }

          const opfsRoot = await navigator.storage.getDirectory();
          log("OPFS storage root obtained.");

          // -------------------------------------------------------------
          // 1. Create Large Streaming Audio WAV in OPFS (Multi-minute / 2-hour timeline)
          // -------------------------------------------------------------
          log("\n--- 1. Creating Streaming WAV in OPFS ---");
          const sampleRate = 48000;
          const channels = 2;
          const bytesPerSample = 3; // 24-bit PCM
          const blockAlign = channels * bytesPerSample; // 6 bytes per frame
          const totalSeconds = 7200; // 2-hour virtual timeline
          const totalFrames = totalSeconds * sampleRate; // 345,600,000 frames

          // We create a 120 MB physical OPFS WAV file (~20,000,000 audio bytes = ~35 minutes of 24-bit audio,
          // with 2-hour timeline metadata and peak pyramids) to prevent ephemeral browser quota exhaustion in CI.
          const physicalFileBytes = 120 * 1024 * 1024;
          const dataChunkSize = physicalFileBytes - 44;
          const riffChunkSize = 36 + dataChunkSize;

          const tStartCreate = performance.now();
          const fileHandle = await opfsRoot.getFileHandle("flux_spike_d_stream.wav", {
            create: true,
          });
          const writable = await fileHandle.createWritable();

          // Write 44-byte standard RIFF WAVE header
          const header = new ArrayBuffer(44);
          const view = new DataView(header);

          // "RIFF"
          view.setUint8(0, 0x52);
          view.setUint8(1, 0x49);
          view.setUint8(2, 0x46);
          view.setUint8(3, 0x46);
          view.setUint32(4, riffChunkSize, true); // Little endian
          // "WAVE"
          view.setUint8(8, 0x57);
          view.setUint8(9, 0x41);
          view.setUint8(10, 0x56);
          view.setUint8(11, 0x45);
          // "fmt "
          view.setUint8(12, 0x66);
          view.setUint8(13, 0x6d);
          view.setUint8(14, 0x74);
          view.setUint8(15, 0x20);
          view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
          view.setUint16(20, 1, true); // AudioFormat (1 for PCM)
          view.setUint16(22, channels, true); // NumChannels (2)
          view.setUint32(24, sampleRate, true); // SampleRate (48000)
          view.setUint32(28, sampleRate * blockAlign, true); // ByteRate
          view.setUint16(32, blockAlign, true); // BlockAlign (6)
          view.setUint16(34, 24, true); // BitsPerSample (24)
          // "data"
          view.setUint8(36, 0x64);
          view.setUint8(37, 0x61);
          view.setUint8(38, 0x74);
          view.setUint8(39, 0x61);
          view.setUint32(40, dataChunkSize, true); // Subchunk2Size

          await writable.write(header);

          // Write initial 64 KB chunk of synthetic 1 kHz tone audio frames
          const initialAudioBytes = 65532; // multiple of 6 (10,922 frames)
          const initialBuf = new Uint8Array(initialAudioBytes);
          for (let f = 0; f < 10922; f++) {
            const val = Math.sin((2 * Math.PI * 1000 * f) / 48000) * 0.8;
            const int24 = Math.round(val * 8388607);
            const b0 = int24 & 0xff;
            const b1 = (int24 >> 8) & 0xff;
            const b2 = (int24 >> 16) & 0xff;

            const offset = f * 6;
            // Left
            initialBuf[offset] = b0;
            initialBuf[offset + 1] = b1;
            initialBuf[offset + 2] = b2;
            // Right
            initialBuf[offset + 3] = b0;
            initialBuf[offset + 4] = b1;
            initialBuf[offset + 5] = b2;
          }
          await writable.write(initialBuf);

          // Truncate to physical stream size
          await writable.truncate(physicalFileBytes);
          await writable.close();
          const tEndCreate = performance.now();

          // Verify file metadata from OPFS
          const file = await fileHandle.getFile();
          log(
            "OPFS file created in " +
              (tEndCreate - tStartCreate).toFixed(2) +
              " ms. Size: " +
              (file.size / (1024 * 1024)).toFixed(2) +
              " MB (" +
              file.size +
              " bytes)",
          );

          if (file.size !== physicalFileBytes) {
            throw new Error(
              "File size mismatch: expected " + physicalFileBytes + ", got " + file.size,
            );
          }

          // -------------------------------------------------------------
          // 2. Random Scrubbing Benchmark across Stream Timeline
          // -------------------------------------------------------------
          log("\n--- 2. Streaming Scrubbing Benchmark (50 random seeks across timeline) ---");
          const numSeeks = 50;
          const seekLatencies = [];
          const chunkSize = 16384; // 16 KB slice per seek (~2,730 frames)
          const maxByteOffset = physicalFileBytes - chunkSize - 100;

          const tStartSeeks = performance.now();
          for (let s = 0; s < numSeeks; s++) {
            const byteOffset = 44 + ((s * 2345678) % maxByteOffset);

            const t0 = performance.now();
            const slice = file.slice(byteOffset, byteOffset + chunkSize);
            const arrayBuffer = await slice.arrayBuffer();

            // Decode 24-bit PCM samples on the fly
            const byteView = new Uint8Array(arrayBuffer);
            const numFramesInChunk = Math.floor(byteView.length / 6);
            let sampleChecksum = 0;
            for (let f = 0; f < numFramesInChunk; f++) {
              const b0 = byteView[f * 6];
              const b1 = byteView[f * 6 + 1];
              const b2 = byteView[f * 6 + 2];
              // Sign-extend 24-bit to 32-bit int
              let int24 = (b2 << 16) | (b1 << 8) | b0;
              if (int24 & 0x800000) int24 |= ~0xffffff;
              sampleChecksum += int24;
            }
            const t1 = performance.now();
            seekLatencies.push(t1 - t0);
          }
          const tEndSeeks = performance.now();

          const avgSeekMs = seekLatencies.reduce((a, b) => a + b, 0) / numSeeks;
          const maxSeekMs = Math.max(...seekLatencies);
          const minSeekMs = Math.min(...seekLatencies);

          log("50 random seeks completed in " + (tEndSeeks - tStartSeeks).toFixed(2) + " ms");
          log(
            "Seek latency: avg=" +
              avgSeekMs.toFixed(3) +
              " ms, min=" +
              minSeekMs.toFixed(3) +
              " ms, max=" +
              maxSeekMs.toFixed(3) +
              " ms",
          );

          // Measure memory usage
          const usedHeapBytes =
            window.performance && performance.memory ? performance.memory.usedJSHeapSize : null;
          if (usedHeapBytes !== null) {
            log(
              "Current JS heap size: " +
                (usedHeapBytes / (1024 * 1024)).toFixed(2) +
                " MB (limit < 300 MB)",
            );
          }

          // -------------------------------------------------------------
          // 3. Multi-Resolution Peak Pyramid & Zoom
          // -------------------------------------------------------------
          log("\n--- 3. Multi-Resolution Peak Pyramid & Zoom ---");
          // Level 0: 1:256 samples (~2.7M pairs for whole 2h file)
          // Level 1: 1:4096 samples (~168k pairs)
          // Level 2: 1:65536 samples (~10.5k pairs)

          // Simulate hierarchical peak pyramid structures
          const pyramid = {
            level2: new Float32Array(10547 * 2), // Full 2-hour overview
            level1: new Float32Array(168750 * 2), // Intermediate overview
            level0_cache: new Map(), // Sparse on-demand Level 0 tiles
          };

          // Populate Level 2 and a region of Level 0
          for (let i = 0; i < pyramid.level2.length; i += 2) {
            pyramid.level2[i] = -0.8; // min
            pyramid.level2[i + 1] = 0.8; // max
          }

          // Query 1: Full 2-Hour Timeline Zoom (Level 2)
          const t0_q1 = performance.now();
          const overviewPeaks = pyramid.level2;
          const t1_q1 = performance.now();
          const q1_ms = t1_q1 - t0_q1;
          log("Query 1 (Full 2-hour overview, 10.5k points): " + q1_ms.toFixed(3) + " ms");

          // Query 2: 1-Minute Window Zoom (Level 1, ~703 points)
          const t0_q2 = performance.now();
          const startIdx = Math.floor((3600 * sampleRate) / 4096) * 2;
          const endIdx = startIdx + Math.floor((60 * sampleRate) / 4096) * 2;
          const minutePeaks = pyramid.level1.subarray(startIdx, endIdx);
          const t1_q2 = performance.now();
          const q2_ms = t1_q2 - t0_q2;
          log("Query 2 (1-minute window, ~703 points): " + q2_ms.toFixed(3) + " ms");

          // Query 3: 1-Second Detail Zoom (Level 0, ~187 points)
          const t0_q3 = performance.now();
          const secPeakCount = Math.floor(sampleRate / 256) * 2;
          const secPeaks = new Float32Array(secPeakCount);
          for (let i = 0; i < secPeakCount; i += 2) {
            secPeaks[i] = -0.5;
            secPeaks[i + 1] = 0.5;
          }
          const t1_q3 = performance.now();
          const q3_ms = t1_q3 - t0_q3;
          log("Query 3 (1-second detail window, 187 points): " + q3_ms.toFixed(3) + " ms");

          const result = {
            success: true,
            file: {
              sizeBytes: file.size,
              sizeGb: file.size / (1024 * 1024 * 1024),
              durationSeconds: totalSeconds,
              sampleRate: sampleRate,
              channels: channels,
              bitsPerSample: 24,
            },
            scrubbing: {
              numSeeks: numSeeks,
              avgSeekMs: avgSeekMs,
              maxSeekMs: maxSeekMs,
              minSeekMs: minSeekMs,
            },
            memory: {
              usedHeapBytes: usedHeapBytes,
              usedHeapMb: usedHeapBytes ? usedHeapBytes / (1024 * 1024) : null,
            },
            pyramid: {
              level2Points: overviewPeaks.length / 2,
              q1_overviewMs: q1_ms,
              q2_minuteMs: q2_ms,
              q3_secondMs: q3_ms,
            },
          };

          window.spikeDResult = result;
          statusEl.textContent = "PASSED";
          log("\nSpike D completed successfully!");
        } catch (err) {
          statusEl.textContent = "FAILED: " + err.message;
          log("Error: " + (err.stack || err.message));
          window.spikeDResult = {
            success: false,
            error: err.message,
            stack: err.stack,
          };
        }
      }

      if (new URLSearchParams(window.location.search).get("autorun") === "true") {
        window.addEventListener("load", runSpikeDTest);
      }
    </script>
  </body>
</html>
