<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Spike F: WASM Encoders &amp; Signalsmith Stretcher</title>
  </head>
  <body>
    <h1>Flux Spike F: Encoders (MP3, Opus, Vorbis, WebCodecs AAC) &amp; Stretcher</h1>
    <div id="status">Ready</div>
    <pre id="output"></pre>

    <script>
      async function runSpikeFTest() {
        const outputEl = document.getElementById("output");
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Running...";

        function log(msg) {
          console.log(msg);
          outputEl.textContent += msg + "\n";
        }

        try {
          // Fetch and instantiate WASM binary
          const wasmResp = await fetch("/target/wasm32-unknown-unknown/debug/flux_wasm.wasm");
          if (!wasmResp.ok) throw new Error("Failed to fetch WASM binary: HTTP " + wasmResp.status);
          const wasmBytes = await wasmResp.arrayBuffer();
          const wasmModule = await WebAssembly.compile(wasmBytes);
          const importObj = {
            __wbindgen_placeholder__: new Proxy({}, { get: () => () => {} }),
            __wbindgen_externref_xform__: new Proxy({}, { get: () => () => {} }),
          };
          const instance = await WebAssembly.instantiate(wasmModule, importObj);
          const exp = instance.exports;

          // -------------------------------------------------------------
          // 1. Signalsmith Stretcher Benchmark (Time-Stretch & Pitch-Shift)
          // -------------------------------------------------------------
          log("--- 1. Signalsmith Stretcher WASM Benchmark ---");
          const stretch = exp.stretch_create(48000.0);
          exp.stretch_set_ratio(stretch, 1.5); // 1.5x time-stretch
          exp.stretch_set_pitch(stretch, 4.0); // +4 semitones pitch shift

          const inBuf = exp.biquad_alloc_buffer(128);
          const outBuf = exp.biquad_alloc_buffer(128);

          // Populate with 1 kHz sine
          const inView = new Float32Array(exp.memory.buffer, inBuf, 128);
          for (let i = 0; i < 128; i++) {
            inView[i] = Math.sin((2 * Math.PI * 1000 * i) / 48000);
          }

          const numBlocks = 1000;
          const t0_stretch = performance.now();
          let nanCount = 0;

          for (let b = 0; b < numBlocks; b++) {
            exp.stretch_process_quantum(stretch, inBuf, outBuf, 128);
            const outView = new Float32Array(exp.memory.buffer, outBuf, 128);
            for (let i = 0; i < 128; i++) {
              if (isNaN(outView[i]) || !isFinite(outView[i])) nanCount++;
            }
          }
          const t1_stretch = performance.now();
          const stretchTotalMs = t1_stretch - t0_stretch;
          const avgBlockUs = (stretchTotalMs / numBlocks) * 1000;
          const blockBudgetUs = (128 / 48000) * 1000000; // 2,666.67 us
          const stretchCpuPercent = (avgBlockUs / blockBudgetUs) * 100;

          log("1,000 blocks stretched in " + stretchTotalMs.toFixed(2) + " ms");
          log("Average block execution: " + avgBlockUs.toFixed(2) + " µs (budget: 2666 µs)");
          log("Stretcher CPU utilization: " + stretchCpuPercent.toFixed(2) + "% (budget <= 30%)");
          log("Stretcher NaN count: " + nanCount);

          exp.biquad_free_buffer(inBuf, 128);
          exp.biquad_free_buffer(outBuf, 128);
          exp.stretch_destroy(stretch);

          // -------------------------------------------------------------
          // 2. WASM Encoders (MP3, Opus, Ogg Vorbis)
          // -------------------------------------------------------------
          log("\n--- 2. WASM Audio Encoders ---");
          const testAudioLen = 48000 * 2; // 1 second stereo (96,000 floats)
          const testAudioPtr = exp.biquad_alloc_buffer(testAudioLen);
          const testAudioView = new Float32Array(exp.memory.buffer, testAudioPtr, testAudioLen);
          for (let i = 0; i < testAudioLen; i++) {
            testAudioView[i] = Math.sin((2 * Math.PI * 440 * i) / 48000) * 0.7;
          }

          // Out len pointer (1 uint32/usize in memory)
          const outLenPtr = exp.biquad_alloc_buffer(1);

          // A. MP3 Encoder
          const mp3Ptr = exp.codec_encode_mp3(testAudioPtr, testAudioLen, 48000, outLenPtr);
          const mp3Len = new Uint32Array(exp.memory.buffer, outLenPtr, 1)[0];
          const mp3Bytes = new Uint8Array(exp.memory.buffer, mp3Ptr, mp3Len);

          // Verify MP3 sync word
          let foundMp3Sync = false;
          for (let i = 0; i < mp3Len - 1; i++) {
            if (mp3Bytes[i] === 0xff && (mp3Bytes[i + 1] & 0xe0) === 0xe0) {
              foundMp3Sync = true;
              break;
            }
          }
          log("MP3 encoded: " + mp3Len + " bytes, valid syncword found: " + foundMp3Sync);
          exp.codec_free_buffer(mp3Ptr, mp3Len);

          // B. Opus Encoder
          const opusPtr = exp.codec_encode_opus(testAudioPtr, testAudioLen, 48000, outLenPtr);
          const opusLen = new Uint32Array(exp.memory.buffer, outLenPtr, 1)[0];
          const opusBytes = new Uint8Array(exp.memory.buffer, opusPtr, opusLen);

          // Verify OggS and OpusHead
          let isOggOpus = false;
          if (opusLen >= 28 && String.fromCharCode(...opusBytes.slice(0, 4)) === "OggS") {
            const str = new TextDecoder().decode(opusBytes);
            if (str.includes("OpusHead") && str.includes("OpusTags")) {
              isOggOpus = true;
            }
          }
          log("Opus encoded: " + opusLen + " bytes, valid Ogg Opus stream: " + isOggOpus);
          exp.codec_free_buffer(opusPtr, opusLen);

          // C. Vorbis Encoder
          const vorbisPtr = exp.codec_encode_vorbis(testAudioPtr, testAudioLen, 48000, outLenPtr);
          const vorbisLen = new Uint32Array(exp.memory.buffer, outLenPtr, 1)[0];
          const vorbisBytes = new Uint8Array(exp.memory.buffer, vorbisPtr, vorbisLen);

          let isOggVorbis = false;
          if (vorbisLen >= 28 && String.fromCharCode(...vorbisBytes.slice(0, 4)) === "OggS") {
            const str = new TextDecoder().decode(vorbisBytes);
            if (str.includes("vorbis")) {
              isOggVorbis = true;
            }
          }
          log("Vorbis encoded: " + vorbisLen + " bytes, valid Ogg Vorbis stream: " + isOggVorbis);
          exp.codec_free_buffer(vorbisPtr, vorbisLen);

          exp.biquad_free_buffer(testAudioPtr, testAudioLen);
          exp.biquad_free_buffer(outLenPtr, 1);

          // -------------------------------------------------------------
          // 3. WebCodecs AAC Availability and Encoding
          // -------------------------------------------------------------
          log("\n--- 3. WebCodecs AAC Platform Encoder ---");
          let webCodecsSupported = false;
          let aacConfigSupported = false;
          let aacChunkCount = 0;
          let aacTotalBytes = 0;

          if (typeof AudioEncoder !== "undefined") {
            webCodecsSupported = true;
            const aacConfig = {
              codec: "mp4a.40.2", // AAC-LC
              sampleRate: 48000,
              numberOfChannels: 2,
              bitrate: 192000,
            };

            const supportCheck = await AudioEncoder.isConfigSupported(aacConfig);
            aacConfigSupported = supportCheck.supported;
            log("AudioEncoder.isConfigSupported('mp4a.40.2'): " + aacConfigSupported);

            if (aacConfigSupported) {
              const chunks = [];
              const encoder = new AudioEncoder({
                output: (chunk) => {
                  chunks.push(chunk);
                  aacTotalBytes += chunk.byteLength;
                },
                error: (e) => log("AAC Encoder error: " + e.message),
              });

              encoder.configure(aacConfig);

              // Feed 4 chunks of 1024 frames of audio (standard AAC frame size)
              const frameSize = 1024;
              for (let f = 0; f < 4; f++) {
                const pcmData = new Float32Array(frameSize * 2);
                for (let i = 0; i < frameSize; i++) {
                  const s = Math.sin((2 * Math.PI * 440 * (f * frameSize + i)) / 48000);
                  pcmData[i] = s;
                  pcmData[frameSize + i] = s;
                }

                const audioData = new AudioData({
                  format: "f32-planar",
                  sampleRate: 48000,
                  numberOfFrames: frameSize,
                  numberOfChannels: 2,
                  timestamp: Math.round((f * frameSize * 1000000) / 48000),
                  data: pcmData,
                });

                encoder.encode(audioData);
                audioData.close();
              }

              await encoder.flush();
              encoder.close();
              aacChunkCount = chunks.length;
              log(
                "WebCodecs AAC encoded: " + aacChunkCount + " chunks, " + aacTotalBytes + " bytes",
              );
            }
          } else {
            log("WebCodecs AudioEncoder not available in this browser context");
          }

          const result = {
            success: true,
            stretcher: {
              avgBlockUs: avgBlockUs,
              cpuPercent: stretchCpuPercent,
              nanCount: nanCount,
            },
            codecs: {
              mp3: {
                encodedBytes: mp3Len,
                hasSyncWord: foundMp3Sync,
              },
              opus: {
                encodedBytes: opusLen,
                isOggOpus: isOggOpus,
              },
              vorbis: {
                encodedBytes: vorbisLen,
                isOggVorbis: isOggVorbis,
              },
            },
            webcodecs: {
              supported: webCodecsSupported,
              aacSupported: aacConfigSupported,
              aacChunkCount: aacChunkCount,
              aacTotalBytes: aacTotalBytes,
            },
          };

          window.spikeFResult = result;
          statusEl.textContent = "PASSED";
          log("\nSpike F completed successfully!");
        } catch (err) {
          statusEl.textContent = "FAILED: " + err.message;
          log("Error: " + (err.stack || err.message));
          window.spikeFResult = {
            success: false,
            error: err.message,
            stack: err.stack,
          };
        }
      }

      if (new URLSearchParams(window.location.search).get("autorun") === "true") {
        window.addEventListener("load", runSpikeFTest);
      }
    </script>
  </body>
</html>
