<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flux Spike C: Binaural Rendering &amp; 8D Prototype</title>
  </head>
  <body>
    <h1>Flux Spike C: Binaural Rendering &amp; 8D Auto-Orbit</h1>
    <div id="status">Ready</div>
    <pre id="output"></pre>

    <script>
      async function runSpikeCTest() {
        const outputEl = document.getElementById("output");
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Running...";

        function log(msg) {
          console.log(msg);
          outputEl.textContent += msg + "\n";
        }

        try {
          // Fetch and compile WASM
          const wasmResp = await fetch("/target/wasm32-unknown-unknown/debug/flux_wasm.wasm");
          if (!wasmResp.ok) throw new Error("Failed to fetch WASM binary: HTTP " + wasmResp.status);
          const wasmBytes = await wasmResp.arrayBuffer();
          const wasmModule = await WebAssembly.compile(wasmBytes);

          // -------------------------------------------------------------
          // 1. Direct Benchmark of binaural_process_quantum
          // -------------------------------------------------------------
          log("--- 1. Direct WASM Benchmark ---");
          const importObj = {
            __wbindgen_placeholder__: new Proxy({}, { get: () => () => {} }),
            __wbindgen_externref_xform__: new Proxy({}, { get: () => () => {} }),
          };
          const instance = await WebAssembly.instantiate(wasmModule, importObj);
          const exp = instance.exports;

          const panner = exp.binaural_create(48000.0);
          exp.binaural_set_orbit_speed(panner, 0.5); // 0.5 Hz orbit

          const inBuf = exp.biquad_alloc_buffer(128);
          const outLBuf = exp.biquad_alloc_buffer(128);
          const outRBuf = exp.biquad_alloc_buffer(128);

          // Populate input with 1 kHz sine
          const inView = new Float32Array(exp.memory.buffer, inBuf, 128);
          for (let i = 0; i < 128; i++) {
            inView[i] = Math.sin((2 * Math.PI * 1000 * i) / 48000);
          }

          const numBlocks = 1000;
          const t0 = performance.now();
          for (let b = 0; b < numBlocks; b++) {
            exp.binaural_process_quantum(panner, inBuf, outLBuf, outRBuf, 128);
          }
          const t1 = performance.now();
          const totalMs = t1 - t0;
          const avgBlockMs = totalMs / numBlocks;
          const blockBudgetMs = (128 / 48000) * 1000; // 2.667 ms
          const cpuPercent = (avgBlockMs / blockBudgetMs) * 100;

          log("1,000 blocks rendered in " + totalMs.toFixed(2) + " ms");
          log("Average block time: " + (avgBlockMs * 1000).toFixed(2) + " µs");
          log("CPU utilization: " + cpuPercent.toFixed(2) + "% (budget <= 30%)");

          exp.biquad_free_buffer(inBuf, 128);
          exp.biquad_free_buffer(outLBuf, 128);
          exp.biquad_free_buffer(outRBuf, 128);
          exp.binaural_destroy(panner);

          // -------------------------------------------------------------
          // 2. AudioWorklet Spatial Cues: Hard Right (+90 deg)
          // -------------------------------------------------------------
          log("\n--- 2. Hard Right (+90 deg) Spatial Cues ---");
          const renderFrames = 48000; // 1 second
          const sampleRate = 48000;

          async function renderSpatialAudio(azimuth, orbitSpeed) {
            const ctx = new OfflineAudioContext(2, renderFrames, sampleRate);
            await ctx.audioWorklet.addModule("/tests/spikes/spike_c/processor.js");

            // Sine oscillator source (1 kHz)
            const osc = ctx.createOscillator();
            osc.frequency.setValueAtTime(1000, 0);

            const workletNode = new AudioWorkletNode(ctx, "flux-binaural-processor", {
              numberOfInputs: 1,
              numberOfOutputs: 1,
              outputChannelCount: [2],
            });

            osc.connect(workletNode);
            workletNode.connect(ctx.destination);

            const readyPromise = new Promise((resolve, reject) => {
              workletNode.port.onmessage = (e) => {
                if (e.data.type === "READY") resolve();
                else if (e.data.type === "ERROR") reject(new Error(e.data.error));
              };
            });

            workletNode.port.postMessage({
              type: "INIT",
              sampleRate: sampleRate,
              wasmModule: wasmModule,
              azimuth: azimuth,
              orbitSpeed: orbitSpeed,
            });

            await readyPromise;
            osc.start(0);
            return await ctx.startRendering();
          }

          // Render hard right (+90 deg, orbit = 0)
          const rightBuffer = await renderSpatialAudio(90.0, 0.0);
          const rightL = rightBuffer.getChannelData(0);
          const rightR = rightBuffer.getChannelData(1);

          // Calculate RMS for both channels
          function calcRms(ch) {
            let sumSq = 0;
            // skip first 500 samples of settling time
            for (let i = 500; i < ch.length; i++) sumSq += ch[i] * ch[i];
            return Math.sqrt(sumSq / (ch.length - 500));
          }

          const rmsL_right = calcRms(rightL);
          const rmsR_right = calcRms(rightR);
          const ildDb_right = 20 * Math.log10(rmsR_right / rmsL_right);
          log(
            "Hard Right: Left RMS=" +
              rmsL_right.toFixed(4) +
              ", Right RMS=" +
              rmsR_right.toFixed(4),
          );
          log("Hard Right ILD: " + ildDb_right.toFixed(2) + " dB (expected > 3 dB)");

          // -------------------------------------------------------------
          // 3. AudioWorklet Spatial Cues: Hard Left (-90 deg)
          // -------------------------------------------------------------
          log("\n--- 3. Hard Left (-90 deg) Spatial Cues ---");
          const leftBuffer = await renderSpatialAudio(-90.0, 0.0);
          const leftL = leftBuffer.getChannelData(0);
          const leftR = leftBuffer.getChannelData(1);

          const rmsL_left = calcRms(leftL);
          const rmsR_left = calcRms(leftR);
          const ildDb_left = 20 * Math.log10(rmsL_left / rmsR_left);
          log(
            "Hard Left: Left RMS=" + rmsL_left.toFixed(4) + ", Right RMS=" + rmsR_left.toFixed(4),
          );
          log("Hard Left ILD: " + ildDb_left.toFixed(2) + " dB (expected > 3 dB)");

          // -------------------------------------------------------------
          // 4. AudioWorklet 8D Auto-Orbit (1.0 Hz rotation)
          // -------------------------------------------------------------
          log("\n--- 4. 8D Auto-Orbit (1.0 Hz continuous rotation) ---");
          const orbitBuffer = await renderSpatialAudio(0.0, 1.0);
          const orbL = orbitBuffer.getChannelData(0);
          const orbR = orbitBuffer.getChannelData(1);

          // Verify no NaNs and bounded click-free deltas
          let nanCount = 0;
          let maxDeltaL = 0;
          let maxDeltaR = 0;

          for (let i = 1; i < orbL.length; i++) {
            if (isNaN(orbL[i]) || !isFinite(orbL[i]) || isNaN(orbR[i]) || !isFinite(orbR[i])) {
              nanCount++;
            }
            const dL = Math.abs(orbL[i] - orbL[i - 1]);
            const dR = Math.abs(orbR[i] - orbR[i - 1]);
            if (dL > maxDeltaL) maxDeltaL = dL;
            if (dR > maxDeltaR) maxDeltaR = dR;
          }

          // Measure alternation: in first quarter (0 to 90 deg), right > left. In third quarter (180 to 270 deg), left > right.
          const quarterSamples = 12000;
          let q1_rightSum = 0;
          let q1_leftSum = 0;
          for (let i = 2000; i < quarterSamples; i++) {
            q1_rightSum += orbR[i] * orbR[i];
            q1_leftSum += orbL[i] * orbL[i];
          }

          let q3_rightSum = 0;
          let q3_leftSum = 0;
          for (let i = 2 * quarterSamples + 2000; i < 3 * quarterSamples; i++) {
            q3_rightSum += orbR[i] * orbR[i];
            q3_leftSum += orbL[i] * orbL[i];
          }

          const q1_rmsR = Math.sqrt(q1_rightSum / 10000);
          const q1_rmsL = Math.sqrt(q1_leftSum / 10000);
          const q3_rmsR = Math.sqrt(q3_rightSum / 10000);
          const q3_rmsL = Math.sqrt(q3_leftSum / 10000);

          log(
            "8D Q1 (Moving Right): Left RMS=" +
              q1_rmsL.toFixed(4) +
              ", Right RMS=" +
              q1_rmsR.toFixed(4),
          );
          log(
            "8D Q3 (Moving Left): Left RMS=" +
              q3_rmsL.toFixed(4) +
              ", Right RMS=" +
              q3_rmsR.toFixed(4),
          );
          log("Max inter-sample delta: L=" + maxDeltaL.toFixed(4) + ", R=" + maxDeltaR.toFixed(4));
          log("NaN count: " + nanCount);

          const result = {
            success: true,
            benchmark: {
              avgBlockUs: avgBlockMs * 1000,
              cpuPercent: cpuPercent,
            },
            hardRight: {
              rmsL: rmsL_right,
              rmsR: rmsR_right,
              ildDb: ildDb_right,
            },
            hardLeft: {
              rmsL: rmsL_left,
              rmsR: rmsR_left,
              ildDb: ildDb_left,
            },
            eightDOrbit: {
              nanCount: nanCount,
              maxDeltaL: maxDeltaL,
              maxDeltaR: maxDeltaR,
              q1_rmsR: q1_rmsR,
              q1_rmsL: q1_rmsL,
              q3_rmsR: q3_rmsR,
              q3_rmsL: q3_rmsL,
            },
          };

          window.spikeCResult = result;
          statusEl.textContent = "PASSED";
          log("\nSpike C completed successfully!");
        } catch (err) {
          statusEl.textContent = "FAILED: " + err.message;
          log("Error: " + err.stack || err.message);
          window.spikeCResult = {
            success: false,
            error: err.message,
            stack: err.stack,
          };
        }
      }

      if (new URLSearchParams(window.location.search).get("autorun") === "true") {
        window.addEventListener("load", runSpikeCTest);
      }
    </script>
  </body>
</html>
