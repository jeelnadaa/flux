[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Unmaintained (not vulnerable) crates pulled in by Tauri's Linux stack (GTK macros, D-Bus).
# No upgrade exists upstream yet. Revisit when Tauri moves off them.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-macros (Tauri on Linux); build-time only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus; via Tauri's D-Bus deps" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus; via Tauri's D-Bus deps" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus; via Tauri's D-Bus deps" },
]
