[package]
name = "flux-core"
description = "Flux audio engine: project model, edits, DSP, playback, analysis, export and the command API"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["device"]
device = ["dep:cpal"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
symphonia = { version = "0.6.1", features = ["all"] }
hound = "3.5"
flacenc = "0.5"
rusty_mp3 = "1.0"
vorbis_rs = "0.5"
rustfft = "6.4"
rtrb = "0.3"
tiny_http = "0.12"
dirs = "6"
zip = { version = "9", default-features = false, features = ["deflate"] }
cpal = { version = "0.18", optional = true, features = ["pulseaudio"] }
# Model downloads (voice cloning): HTTPS with the same TLS stack the app's updater uses, checksums, free space,
# and unpacking the portable Python archive.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy", "json", "multipart"] }
# Cloud engine keys live in the system keychain (Credential Manager, Keychain, Secret Service).
keyring = "4.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
fs4 = "0.13"
flate2 = "1"
tar = "0.4"
