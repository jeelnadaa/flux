[package]
name = "flux-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux WebAssembly bindings for browser execution"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flux-dsp = { path = "../flux-dsp" }
flux-engine = { path = "../flux-engine" }
flux-ml = { path = "../flux-ml" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
