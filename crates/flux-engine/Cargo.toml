[package]
name = "flux-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux audio playback engine and graph orchestration"

[dependencies]
flux-dsp = { path = "../flux-dsp" }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "vorbis", "ogg", "isomp4", "mkv", "pcm", "all-meta"] }
opus1 = { version = "0.3.0", default-features = false, features = ["std", "heap"] }
tao = "0.37"
wry = "0.57"
tiny_http = "0.12"

[[bin]]
name = "flux"
path = "src/bin/flux.rs"

[dev-dependencies]
flux-testkit = { path = "../flux-testkit" }
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
