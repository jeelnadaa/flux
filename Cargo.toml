[workspace]
resolver = "2"
members = [
    "crates/flux-dsp",
    "crates/flux-engine",
    "crates/flux-ml",
    "crates/flux-wasm",
    "crates/flux-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Flux Contributors"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
